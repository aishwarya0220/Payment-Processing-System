name: payment-processing

services:
  database:
    image: postgres:16
    container_name: postgresql
    restart: unless-stopped

    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

    ports:
      - "5432:5432"

    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data                  #postgres_data is the folder which stores data in host machine
                                                                #/var/lib/postgresql/data is the path inside container that saves data
    networks:
      - payment-net


  cache:
    image: redis:7
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"

    networks:
      - payment-net

  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: rabbitmq
    restart: unless-stopped

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - payment-net

  nginx:
    image: nginx:alpine
    container_name: api-gateway
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - order-service
      - payment-service

    networks:
      - payment-net

  order-service:
    build: ./backend/services/order-service
    container_name: order-service
    restart: unless-stopped

    environment:
      - PORT=3001
      - DATABASE_URL="postgresql://postgres:postgres@database:5432/order_db?schema=public"
      - REDIS_HOST=redis://cache:6379

    depends_on:
      - database
      - cache

    networks:
      - payment-net

  payment-service:
    build: ./backend/services/payment-service
    container_name: payment-service
    restart: unless-stopped

    environment:
      - PORT=3002
      - DATABASE_URL="postgresql://postgres:postgres@database:5432/payment_db?schema=public"
      - RABBITMQ_HOST=rabbitmq
      - REDIS_HOST=cache

    depends_on:
      database:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      cache:
        condition: service_started

    networks:
      - payment-net

  notification-service:
    build: ./backend/services/notification-service
    container_name: notification-service
    restart: unless-stopped

    environment:
      - PORT=3003
      - RABBITMQ_HOST=rabbitmq

    depends_on:
      rabbitmq:
        condition: service_healthy
    
    networks:
      - payment-net

networks:
  payment-net:
    driver: bridge

volumes:
  postgres_data: